                <h3>项目介绍</h3>
                <p>滤旅是一款专注净化旅行信息的移动端 APP，主打信息过滤、零广告攻略、私密旅行记录。针对当下旅游平台信息泛滥、内容过时、社交压力大等痛点，通过算法与人工审核剔除无效内容，提供真实时效攻略与必游榜单，并支持个人 / 团体行程定制、地图定位、旅行回忆录等功能。整体以红色为主色调，界面简洁轻量化，让用户回归纯粹旅行体验。</p>
