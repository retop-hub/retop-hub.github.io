<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人网站</title>
    <link rel="stylesheet" href="./message.css">
    <link href="https://fonts.googleapis.com/css?family=站酷高端黑&display=swap" rel="stylesheet">
</head>
<body>
    <form id="contactForm">
        <h1>Contact <span>us!</span></h1>
        <input class="ipt" type="text" id="text" placeholder="your name here" required maxlength="12" name="uname"></input>
        <input class="ipt" type="email" id="mail" placeholder="your email here" required maxlength="17" name="uemail"></input>
        <textarea class="ipt" id="textareaMsg" placeholder="your message here" required maxlength="30" name="umsg"></textarea>
        <button type="submit" class="btn submit-btn">submit</button>
        <button type="reset" class="btn reset-btn"  onclick="clearForm()">reset</button>
        <button type="button" class="btn cart" onclick="showAlert()"><span class="iconfont icon-shoppingcart"></span> <span>message</span><span
            class="number">8</span></button>
        <div class="back">Don't send message ? <a class="link" href="./index.html">back</a></div>
    </form>
    <script src="./message.js"></script>
</body>
</html>
